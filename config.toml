# Pics Manager settings. Restart the server after editing.
# Environment variables PORT, SORT_DIR and PICS_MODEL override the [app] values.

[app]
port = 8769
sort_dir = "~/Downloads"
# Model used when none is picked in the UI. Must be one of the [[models]] ids below.
default_model = "claude-opus-5-5"
# Long edge (px) of the image sent to the model. Smaller is cheaper and faster.
max_edge = 1024

# Folders for the Sort view. The text after "=" tells the model what belongs there.
# "Other" is always added if you leave it out.
[categories]
"Selfies & talking" = "a person facing the camera, selfies, talking-head videos, vlogs"
"Outfits" = "clothing, mirror outfit shots, fashion, shoes, accessories as the subject"
"Food & cafes" = "food, drinks, restaurants, cafes, cooking"
"Nature" = "landscapes, plants, sky, sea, animals outdoors"
"Aesthetic & decor" = "interiors, candles, flowers, moodboard-style still life, architecture details"
"Sport & wellness" = "workouts, gym, yoga, running, skincare, wellness routines"
"Music & hobby" = "instruments, concerts, crafts, games, hobbies"
"Work from home" = "laptops, desks, notebooks, coffee-and-laptop work scenes"
"Text & captions" = "images whose main content is text, quotes, captions, posters, memes with text"
"Screenshots" = "screenshots or screen recordings of phone/computer UIs"
"Other" = "anything that fits none of the above"

# Models shown in the UI's model picker.
#   provider    "anthropic" (needs ANTHROPIC_API_KEY) or "ollama" (local, free)
#   effort      Claude only: low | medium | high. "low" is plenty for tagging.
#   fallbacks   Claude only: if the model declines an image, the API retries it
#               on another model automatically. Not supported on Haiku.
#   concurrency how many images are analyzed at once

[[models]]
id = "claude-opus-5-5"
label = "Claude Opus 5.5 · best quality"
provider = "anthropic"
effort = "low"
fallbacks = true
concurrency = 4

[[models]]
id = "claude-sonnet-5-5"
label = "Claude Sonnet 5.5 · balanced"
provider = "anthropic"
effort = "low"
fallbacks = true
concurrency = 4

[[models]]
id = "claude-haiku-5-5"
label = "Claude Haiku 5.5 · cheapest & fastest"
provider = "anthropic"
effort = "low"
fallbacks = false
concurrency = 6

[[models]]
id = "qwen2.5vl:7b"
label = "Qwen2.5-VL 7B · local via Ollama, free"
provider = "ollama"
host = "http://localhost:11434"
concurrency = 1
